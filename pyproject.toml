[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "dockyard-audit"
version = "1.0.0"
description = "A read-only Docker environment auditor for containers, images, volumes, and Compose files."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Akhil Alladi" }]
dependencies = ["typer>=0.12,<1.0", "rich>=13.7,<15.0", "PyYAML>=6.0,<7.0", "docker>=7.0,<8.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0,<9.0", "pytest-cov>=5.0,<7.0", "ruff>=0.5,<1.0"]

[project.scripts]
dockyard = "dockyard_audit.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["dockyard_audit"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
