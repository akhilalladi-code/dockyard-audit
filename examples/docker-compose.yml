services:
  api:
    image: python:3.12-slim
    command: ["python", "-m", "http.server", "8000"]
    ports:
      - "8000:8000"
    user: "10001:10001"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000')"]
      interval: 30s
      timeout: 5s
      retries: 3
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
